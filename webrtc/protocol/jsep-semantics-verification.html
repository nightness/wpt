<!doctype html>
<meta charset=utf-8>
<title>RTCPeerConnection setRemoteDescription semantics verification</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="../RTCPeerConnection-helper.js"></script>
<script src="../third_party/sdp/sdp.js"></script>
<script>
'use strict';

// Tests for the checks of [RFC9429] section 5.8.3 (Semantics Verification):
// https://www.rfc-editor.org/rfc/rfc9429#section-5.8.3
//   "If any of the preceding checks failed, processing MUST stop and an error
//   MUST be returned."
//
// https://w3c.github.io/webrtc-pc/#set-description
//   "If the description failed semantics validation as defined in [RFC9429]
//   Section 5.8.3., then reject p with a newly created InvalidAccessError and
//   abort these steps."
//
// Each test first checks that the unmodified description is accepted, so that
// a rejection can only be caused by the modification.

// Returns an offerer in have-local-offer and the answer to its offer, which
// has an audio and a video m= section.
async function createOffererAndAnswer(t) {
  const offerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  const answerer = new RTCPeerConnection();
  t.add_cleanup(() => answerer.close());
  offerer.addTransceiver('audio');
  offerer.addTransceiver('video');
  const offer = await offerer.createOffer();
  await offerer.setLocalDescription(offer);
  await answerer.setRemoteDescription(offer);
  const answer = await answerer.createAnswer();
  return {offerer, answer};
}

// Checks that the answer passed through `modify` is rejected.
async function checkModifiedAnswerRejected(t, modify) {
  const control = await createOffererAndAnswer(t);
  await control.offerer.setRemoteDescription(control.answer);

  const {offerer, answer} = await createOffererAndAnswer(t);
  const sdp = modify(answer.sdp);
  assert_not_equals(sdp, answer.sdp, 'the modification changed the answer');
  await promise_rejects_dom(t, 'InvalidAccessError',
      offerer.setRemoteDescription({type: 'answer', sdp}));
}

// [RFC9429] section 5.8.3:
//   "If this session description is of type "pranswer" or "answer", the
//   following additional checks are applied:
//   * The session description MUST follow the rules defined in [RFC3264],
//     Section 6, including the requirement that the number of "m=" sections
//     MUST exactly match the number of "m=" sections in the associated offer."
promise_test(async t => {
  await checkModifiedAnswerRejected(t, sdp => {
    const [session, ...mediaSections] = SDPUtils.splitSections(sdp);
    const removedMid = SDPUtils.getMid(mediaSections.pop());
    const editedSession = session.replace(/^a=group:BUNDLE .*$/m,
        line => line.split(' ').filter(tag => tag !== removedMid).join(' '));
    return editedSession + mediaSections.join('');
  });
}, 'setRemoteDescription(answer) with fewer m= sections than the offer ' +
   'rejects with InvalidAccessError');

// [RFC9429] section 5.8.3:
//   "* For each "m=" section, the media type and protocol values MUST exactly
//     match the media type and protocol values in the corresponding "m="
//     section in the associated offer."
promise_test(async t => {
  await checkModifiedAnswerRejected(t,
      sdp => sdp.replace(/^m=video /m, 'm=audio '));
}, 'setRemoteDescription(answer) with a media type different from the offer ' +
   'rejects with InvalidAccessError');

// [RFC9429] section 5.8.3:
//   "* A DTLS setup value, which MUST be set according to the rules specified
//     in [RFC5763], Section 5 [...]"
// https://www.rfc-editor.org/rfc/rfc5763#section-5
//   "The answerer MUST use either a setup attribute value of setup:active or
//   setup:passive."
promise_test(async t => {
  await checkModifiedAnswerRejected(t,
      sdp => sdp.replace(/^a=setup:\S+$/gm, 'a=setup:actpass'));
}, 'setRemoteDescription(answer) with a=setup:actpass rejects with ' +
   'InvalidAccessError');

</script>
