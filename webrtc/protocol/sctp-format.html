<!doctype html>
<meta charset=utf-8>
<title>RTCPeerconnection SDP SCTP format test</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="../RTCPeerConnection-helper.js"></script>
<script>
'use strict';

promise_test(async t => {
  const caller = new RTCPeerConnection();
  const callee = new RTCPeerConnection();
  t.add_cleanup(() => caller.close());
  t.add_cleanup(() => callee.close());
  caller.createDataChannel('channel');
  const offer = await caller.createOffer();
  const [preamble, media_section, postamble] = offer.sdp.split('\r\nm=');
  assert_true(typeof(postamble) === 'undefined');
  assert_greater_than(media_section.search(
    /^application \d+ UDP\/DTLS\/SCTP webrtc-datachannel\r\n/), -1);
  assert_greater_than(media_section.search(/\r\na=sctp-port:\d+\r\n/), -1);
  assert_greater_than(media_section.search(/\r\na=mid:/), -1);
}, 'Generated Datachannel SDP uses correct SCTP offer syntax');

// https://www.rfc-editor.org/rfc/rfc9429#section-5.3.1
//   "If a data channel "m=" section has been offered, an "m=" section MUST
//   also be generated for data. The <media> field MUST be set to
//   "application", and the <proto> and <fmt> fields MUST be set to exactly
//   match the fields in the offer.
//   Within the data "m=" section, an "a=mid" line MUST be generated and
//   included as described above, along with an "a=sctp-port" line
//   referencing the SCTP port number, as defined in [RFC8841], Section 5.1"
promise_test(async t => {
  const caller = new RTCPeerConnection();
  const callee = new RTCPeerConnection();
  t.add_cleanup(() => caller.close());
  t.add_cleanup(() => callee.close());
  caller.createDataChannel('channel');
  await callee.setRemoteDescription(await caller.createOffer());
  const answer = await callee.createAnswer();
  const [preamble, media_section, postamble] = answer.sdp.split('\r\nm=');
  assert_true(typeof(postamble) === 'undefined');
  assert_greater_than(media_section.search(
    /^application \d+ UDP\/DTLS\/SCTP webrtc-datachannel\r\n/), -1);
  assert_greater_than(media_section.search(/\r\na=sctp-port:\d+\r\n/), -1);
  assert_greater_than(media_section.search(/\r\na=mid:/), -1);
}, 'Generated Datachannel SDP uses correct SCTP answer syntax');

</script>
