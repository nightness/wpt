<!doctype html>
<meta charset=utf-8>
<title>RTCPeerConnection.prototype.createAnswer</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="RTCPeerConnection-helper.js"></script>
<script>
'use strict';

promise_test(async t => {
  const pc = new RTCPeerConnection();
  t.add_cleanup(() => pc.close());

  await promise_rejects_dom(t, 'InvalidStateError', pc.createAnswer());
}, 'createAnswer() with null remoteDescription should reject with InvalidStateError');

promise_test(async t => {
  const pc = new RTCPeerConnection();
  t.add_cleanup(() => pc.close());

  const offer = await pc.createOffer();
  await pc.setRemoteDescription(offer);
  const answer = await pc.createAnswer();
  assert_equals(typeof answer, 'object',
    'Expect answer to be plain object (dictionary RTCSessionDescriptionInit)');
  assert_false(answer instanceof RTCSessionDescription,
    'Expect answer to not be instance of RTCSessionDescription');
}, 'createAnswer() returns RTCSessionDescriptionInit');

promise_test(async t => {
  const pc = new RTCPeerConnection();
  t.add_cleanup(() => pc.close());

  // generateDataChannelOffer() is defined in RTCPeerConnection-helper.js.
  const offer = await generateDataChannelOffer(pc);
  await pc.setRemoteDescription(offer);
  pc.close();
  await promise_rejects_dom(t, 'InvalidStateError', pc.createAnswer());
}, 'createAnswer() when connection is closed should reject with InvalidStateError');

// https://w3c.github.io/webrtc-pc/#dom-rtcpeerconnection-createanswer
// To create an answer given connection run the following steps:
//   If connection.[[SignalingState]] is neither "have-remote-offer" nor
//   "have-local-pranswer", return a promise rejected with a newly created
//   InvalidStateError.
promise_test(async t => {
  const pc = new RTCPeerConnection();
  t.add_cleanup(() => pc.close());

  pc.addTransceiver('audio');
  await pc.setLocalDescription(await pc.createOffer());
  assert_equals(pc.signalingState, 'have-local-offer');

  await promise_rejects_dom(t, 'InvalidStateError', pc.createAnswer());
}, 'createAnswer() in have-local-offer should reject with InvalidStateError');

promise_test(async t => {
  const offerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  const answerer = new RTCPeerConnection();
  t.add_cleanup(() => answerer.close());

  offerer.addTransceiver('audio');
  const offer = await offerer.createOffer();
  await offerer.setLocalDescription(offer);
  await answerer.setRemoteDescription(offer);
  const {sdp} = await answerer.createAnswer();
  await offerer.setRemoteDescription({type: 'pranswer', sdp});
  assert_equals(offerer.signalingState, 'have-remote-pranswer');

  await promise_rejects_dom(t, 'InvalidStateError', offerer.createAnswer());
}, 'createAnswer() in have-remote-pranswer should reject with InvalidStateError');

promise_test(async t => {
  const offerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  const answerer = new RTCPeerConnection();
  t.add_cleanup(() => answerer.close());

  offerer.addTransceiver('audio');
  await exchangeOfferAnswer(offerer, answerer);
  assert_equals(answerer.signalingState, 'stable');
  assert_not_equals(answerer.remoteDescription, null);

  await promise_rejects_dom(t, 'InvalidStateError', answerer.createAnswer());
}, 'createAnswer() in stable after a completed offer/answer exchange should ' +
   'reject with InvalidStateError');

</script>
